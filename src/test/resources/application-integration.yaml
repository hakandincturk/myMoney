spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
      jakarta:
        persistence:
          validation:
            mode: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

jwt:
  secret:
    key: dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cw==
