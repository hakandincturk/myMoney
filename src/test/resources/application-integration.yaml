spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
      jakarta:
        persistence:
          validation:
            mode: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

