server:
  # Overridable per environment; prod must pass SERVER_PORT to match the nginx upstream.
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: myMoney

  datasource:
    # Machine specific values belong in .env, not here. Prod overrides all of this
    # through application-prod.yaml.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/myMoney_prod}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:hakandincturk}
    password: ${DB_PASSWORD:}
  
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: true
      jakarta:
        persistence:
          validation:
            mode: none
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.type.descriptor.sql: trace
    # org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: WARN
    # org.springframework.boot: WARN
    # org.springframework.security: WARN

app:
  session:
    # Server-side login sessions (HttpOnly cookie "mm_session").
    idle-timeout: 7d
    absolute-timeout: 30d
    touch-interval: 5m
    # false only for local development over plain http
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:true}

cors:
  # Comma-separated origins, e.g. "https://domain1.com,https://domain2.com".
  # Falls back to the local Vite origins when CORS_ALLOWED_ORIGINS is not set. Never "*":
  # session cookies are sent with credentials and OriginCheckFilter trusts this list.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}